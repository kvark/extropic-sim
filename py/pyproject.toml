[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "extropic-sim"
description = "Portable simulator for thermodynamic computing, in the flavor of THRML"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]

[tool.maturin]
module-name = "extropic_sim"
